services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_agent}
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  python-agent:
    build:
      context: ../python-agent
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-interview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-interview_agent}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY in .env}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  java-backend:
    build:
      context: ../java-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview_agent}
      DATABASE_USERNAME: ${POSTGRES_USER:-interview}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      PYTHON_AGENT_BASE_URL: http://python-agent:8000
    depends_on:
      postgres:
        condition: service_healthy
      python-agent:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
    depends_on:
      java-backend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  postgres-data:
  redis-data:
