services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_agent}
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-interview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  python-agent:
    build:
      context: ../python-agent
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-interview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-interview_agent}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY in .env}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "8000"
    restart: unless-stopped

  java-backend:
    build:
      context: ../java-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview_agent}
      DATABASE_USERNAME: ${POSTGRES_USER:-interview}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-interview}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PYTHON_AGENT_BASE_URL: http://python-agent:8000
      PYTHON_AGENT_READ_TIMEOUT: ${PYTHON_AGENT_READ_TIMEOUT:-11m}
      AGENT_RABBIT_RETRY_MAX_ATTEMPTS: ${AGENT_RABBIT_RETRY_MAX_ATTEMPTS:-2}
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      AGENT_FILE_STORAGE_ROOT: /app/data/files
      AGENT_PDF_FONT_PATH: /app/fonts/NotoSansCJKsc-Regular.otf
      AGENT_SYSTEM_KNOWLEDGE_BASE_IDS: ${AGENT_SYSTEM_KNOWLEDGE_BASE_IDS:?set AGENT_SYSTEM_KNOWLEDGE_BASE_IDS in .env}
    volumes:
      - java-files:/app/data
      - ./fonts:/app/fonts:ro
    depends_on:
      postgres:
        condition: service_healthy
      python-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    depends_on:
      java-backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  java-files:
